<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageSurgeon</title>
    <link rel="stylesheet" href="./styles/popup.css">
</head>

<body>
    <div class="popup">
        <header class="popup__header">
            <div>
                <h1 class="popup__title">PageSurgeon</h1>
                <p class="popup__subtitle">Surgical page editing</p>
            </div>
        </header>

        <main class="popup__main">
            <div class="popup__status">
                <span class="popup__status-label">Status</span>
                <span class="popup__status-value" id="statusValue">Inactive</span>
            </div>

            <div class="popup__refresh-notice" id="refreshNotice" hidden>
                <p>PageSurgeon couldn't connect to this page.</p>
                <p><a href="#" id="refreshLink">Refresh the page</a> and try again.</p>
            </div>

            <div class="popup__mode-selector">
                <label class="popup__mode-option">
                    <input type="radio" name="mode" value="delete" checked>
                    <span class="popup__mode-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2.5 4.5h11M6 4.5V3.2c0-.4.3-.7.7-.7h2.6c.4 0 .7.3.7.7v1.3M4 4.5l.6 8.4c0 .6.5 1.1 1.1 1.1h4.6c.6 0 1.1-.5 1.1-1.1l.6-8.4M6.5 7v4.5M9.5 7v4.5"/>
                        </svg>
                    </span>
                    <span class="popup__mode-label">Delete</span>
                </label>
                <label class="popup__mode-option">
                    <input type="radio" name="mode" value="edit">
                    <span class="popup__mode-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 11.5 11.5 3l1.5 1.5L4.5 13H3zM9.5 5 11 6.5"/>
                        </svg>
                    </span>
                    <span class="popup__mode-label">Edit text</span>
                </label>
                <label class="popup__mode-option">
                    <input type="radio" name="mode" value="screenshot">
                    <span class="popup__mode-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 5.5c0-.6.4-1 1-1h1.7l.8-1.2c.2-.2.4-.3.7-.3h3.6c.3 0 .5.1.7.3l.8 1.2H13c.6 0 1 .4 1 1v6c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"/>
                            <circle cx="8" cy="8.5" r="2.2"/>
                        </svg>
                    </span>
                    <span class="popup__mode-label">Screenshot</span>
                </label>
                <label class="popup__mode-option">
                    <input type="radio" name="mode" value="blur">
                    <span class="popup__mode-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8 2.5c2.2 2.6 3.5 4.4 3.5 6.1a3.5 3.5 0 1 1-7 0c0-1.7 1.3-3.5 3.5-6.1z"/>
                        </svg>
                    </span>
                    <span class="popup__mode-label">Blur</span>
                </label>
            </div>

            <div class="popup__actions">
                <button class="popup__button popup__button--primary" id="activateButton">
                    Activate delete
                </button>
                <button class="popup__button popup__button--secondary" id="helpButton">
                    Help
                </button>
            </div>

            <details class="popup__info" id="helpDetails">
                <summary class="popup__info-summary">
                    <span class="popup__info-title">How to use</span>
                    <svg class="popup__info-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 4.5 6 7.5 9 4.5"/>
                    </svg>
                </summary>
                <ol class="popup__steps" id="helpSteps">
                    <li>Select a mode above</li>
                    <li>Click "Activate" to start</li>
                    <li>Hover to highlight, click to act</li>
                    <li>Use the side panel for more options</li>
                </ol>
            </details>
        </main>

        <footer class="popup__footer">
            <p class="popup__version">v0.1.0</p>
        </footer>
    </div>

    <script src="./scripts/popup.js"></script>
</body>

</html>
